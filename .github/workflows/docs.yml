name: Documentation

on:
  push:
    paths:
      - 'docs/**'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'docs/**'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build HTML with warnings treated as errors
        run: python -m sphinx -b html -W --keep-going -n docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: shybox-docs-html
          path: docs/_build/html
