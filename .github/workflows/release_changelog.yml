name: Publish release notes

on:
  push:
    tags:
      - 'main/*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing main release tag (for example main/1.7.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Extract maintained changelog entry
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not tag.startswith('main/'):
              raise SystemExit('Expected a main/<version> release tag')
          version = tag.removeprefix('main/')
          lines = Path('CHANGELOG').read_text().splitlines()
          start = next(i for i, line in enumerate(lines)
                       if line.startswith(f'Version {version} ['))
          end = next((i for i in range(start + 2, len(lines))
                      if lines[i].startswith('Version ')), len(lines))
          Path('release-notes.md').write_text('\n'.join(lines[start + 2:end]).strip() + '\n')
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "SHYBOX ${RELEASE_TAG#main/}" --notes-file release-notes.md --latest
          fi
