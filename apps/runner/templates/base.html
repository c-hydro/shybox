<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HMC Runner UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <style>
    pre.log {background:#0b1021; color:#d6d6d6; padding:1rem; border-radius:6px; max-height: 60vh; overflow:auto;}
    .is-mono {font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;}
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title">HMC Runner (Flask + Bulma)</h1>
      <p class="subtitle">Configure & Run</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="notification">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </section>
</body>
</html>
